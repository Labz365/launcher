name: Release Canvas

# Builds the Aelix Canvas web app, zips it, publishes a GitHub Release, and bumps
# canvas.json (version + url + sha256) on main so the launcher's CANVAS tab picks
# up the new module automatically. Trigger by pushing a tag like `canvas-v0.2.0`.
#
#   git tag canvas-v0.2.0
#   git push origin canvas-v0.2.0
#
# The launcher downloads aelix-canvas-web.zip through its allowlist + SHA-256
# pipeline, so CI writes the freshly-computed hash into canvas.json for you.

on:
  push:
    tags:
      - 'canvas-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.2.0 (without the canvas-v prefix)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve version + tag
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#canvas-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=canvas-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build web app
        working-directory: aelix-canvas
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Package + hash
        id: pkg
        run: |
          ( cd aelix-canvas/dist && zip -r "$GITHUB_WORKSPACE/aelix-canvas-web.zip" . )
          SHA=$(sha256sum aelix-canvas-web.zip | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Built zip sha256=$SHA"

      - name: Bump canvas.json on main
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.pkg.outputs.sha256 }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          node -e "const fs=require('fs');const v=process.env.VERSION;const url='https://github.com/'+process.env.REPO+'/releases/download/canvas-v'+v+'/aelix-canvas-web.zip';fs.writeFileSync('canvas.json', JSON.stringify({version:v,url,sha256:process.env.SHA},null,2)+'\n');"
          git add canvas.json
          git commit -m "canvas.json -> v$VERSION (CI)" || echo "canvas.json unchanged"
          git push origin main

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          files: aelix-canvas-web.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
